name: Sprint 1 CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Static publishing preview syntax and boundaries
        run: python scripts/check_ui_preview.py
      - name: Verify standalone preview included in build
        run: test -f frontend/dist/ui-review.html && test -f frontend/dist/bid-detail-review.html && test -f frontend/dist/bid-management-preview.html
      - name: Package offline UI preview
        uses: actions/upload-artifact@v4
        with:
          name: bid-management-ui-preview
          path: |
            frontend/dist/ui-review.html
            frontend/dist/bid-detail-review.html
            frontend/dist/bid-management-preview.html
          if-no-files-found: error
          retention-days: 14

