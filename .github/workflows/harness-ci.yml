name: Development harness
on:
  push:
    branches: ['feat/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harness synthetic acceptance
        run: python -m unittest discover -s scripts -p test_task_harness.py -v
