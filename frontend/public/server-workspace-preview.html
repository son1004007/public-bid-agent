<div><header class="topbar"><button class="menu" id="menu" aria-label="메뉴 열기" aria-expanded="false">☰</button><div class="crumb">워크스페이스 / <strong id="crumb">검토할 일</strong></div><div class="topright"><span class="pill">최종 결정 사용자 / 검토 사용자</span><button data-page="login">로그인 동선 보기</button><span class="avatar" aria-hidden="true">검</span></div></header><div class="demo"><span><b>화면 시안</b> 가상 자료입니다. 실제 정보를 입력하지 마세요.</span><span>새로고침하면 초기화됩니다.</span></div><main class="content" id="main" tabindex="-1"></main></div></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const samples=[{id:1,title:'민원 상담 지식검색 서비스 구축',org:'가상 디지털지원원',field:'AI',deadline:'예시 D-3',risk:'원본 확인 필요',next:'정정 첨부와 기존 추출 비교',budget:'2.4억원 (가상)'},{id:2,title:'지역 통계 데이터 품질 개선',org:'가상 데이터진흥원',field:'DATA',deadline:'예시 D-7',risk:'인력 증빙 부족',next:'투입 인력, 공수 확인',budget:'1.6억원 (가상)'},{id:3,title:'업무 포털 접근성 개선',org:'가상 공공연구소',field:'SW',deadline:'예시 D-12',risk:'역량 보완 검토',next:'협력 가능 역량, 비용 확인',budget:'9천만원 (가상)'},{id:4,title:'문서 분류 자동화 실증',org:'가상 행정연구원',field:'AI',deadline:'마감일 미확인',risk:'첨부 미확보',next:'공식 첨부 확보 필요',budget:'미확인'},{id:5,title:'통합 데이터 운영 지원',org:'가상 정보센터',field:'DATA',deadline:'취소',risk:'취소 공고',next:'취소 이력 보존',budget:'미확인'}];
let selected=1,detailTab='summary',page='home',filter='',query='',scenario='normal',reviewState='미검수',toastTimer,authStep='login';
const decisionRecords={};
const proposalEdits={};
const reviewDraft={category:'과업 요구사항',gold:'제안사는 검색 결과에 원문 출처를 표시해야 한다.',location:'1쪽 / 과업 범위'};
let approvedReview=null;
const names={home:'사업 기회',notices:'공고 탐색',documents:'문서 확인',decisions:'판단 기록',company:'회사 증빙',operations:'수집 관리',settings:'설정',detail:'공고 상세',review:'원본 대조',login:'계정 로그인',proposal:'제안서',connections:'연결 설정',criteria:'검토 기준',users:'사용자 관리',interests:'업무 관심 분야',audit:'감사 및 변경 기록',candidates:'검토 후보',jobs:'작업 현황',requirements:'요구사항 대응표',strategy:'제안 전략',preparation:'제출 준비',outcomes:'결과 기록',account:'내 계정',states:'공통 상태',screens:'전체 화면',evidenceEdit:'증빙 등록',workforce:'인력과 원가',versions:'원본 변경 이력'};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(t,kind='warn')=>`<span class="badge ${kind}">${esc(t)}</span>`;
const head=(title,desc,action='')=>`<div class="head"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`;
const btn=(label,route,primary=false)=>`<button data-page="${route}" class="${primary?'primary':''}">${label}</button>`;
function noticeRows(items){return items.map(n=>`<tr><td><button class="link" data-notice="${n.id}">${n.title}</button><small>${n.org} / ${n.field}</small></td><td data-label="마감">${n.deadline}</td><td data-label="확인할 점">${badge(n.risk,n.id===5?'red':'warn')}</td><td data-label="다음 작업">${n.next}</td><td><button data-notice="${n.id}">검토하기</button></td></tr>`).join('');}
function table(items){return `<div class="tablewrap"><table><thead><tr><th>공고 / 기관</th><th>마감</th><th>확인할 점</th><th>다음 작업</th><th>검토</th></tr></thead><tbody>${noticeRows(items)}</tbody></table></div>`;}
function home(){const n=samples.find(x=>x.id===selected);return `<div class="deskheading"><h1>사업 기회</h1><span class="muted">준비된 자료를 확인하고 참여 여부를 결정합니다.</span></div><div class="deskviews"><button class="active" data-page="home">전체 5</button><button data-page="documents">확인 필요</button><button data-page="proposal">제안서</button><span>가상 자료</span></div><div class="opportunitydesk"><section class="opportunitylist" aria-label="사업 선택">${samples.map(x=>`<button class="opportunity ${x.id===selected?'selected':''}" data-brief="${x.id}" aria-pressed="${x.id===selected}"><span class="opportunityline"><b>${x.field}</b><span>${x.deadline}</span></span><strong>${x.title}</strong><small>${x.org}</small><span class="case-status">${x.risk}</span></button>`).join('')}</section><article class="casefile"><div class="case-toolbar"><span>사업 검토 자료</span>${btn('상세 정보','detail')}</div><h2>${n.title}</h2><p class="muted">${n.org}</p><dl class="casefacts"><div><dt>공고 예산</dt><dd>${n.budget}</dd></div><div><dt>마감</dt><dd>${n.deadline}</dd></div><div><dt>참가자격</dt><dd>확인 전</dd></div><div><dt>예상 이익</dt><dd>원가 근거 필요</dd></div></dl><section class="case-section"><h3>사업 검토 요약</h3><p>${n.next}. 확보된 원문과 회사 자료를 대조해 제안 방향을 준비합니다.</p><p class="muted">이 시안은 자동 분석 결과가 아닙니다. 자격과 수익성은 미검증 상태입니다.</p></section><section class="case-section"><div class="section-line"><h3>제안서 초안</h3><span class="document-label">합성 예시</span></div><div class="document-row"><span class="doc-symbol" aria-hidden="true">문서</span><div><b>사업 이해와 수행 방안</b><small>원문 근거와 미확인 사항 포함</small></div>${btn('열기','proposal')}</div></section><section class="case-section"><h3>자동 준비 현황</h3><ol class="automationlist"><li>공고 수집 <span>예시 자료 있음</span></li><li>원문과 부서 역량 대조 <span>근거 확인 필요</span></li><li>제안 전략과 초안 <span>예시 보기</span></li></ol></section><div class="decisionbar"><span>참여 여부는 사용자가 결정합니다.</span>${btn('결정 기록','decisions',true)}</div></article></div>`;}
function notices(){return head('공고 탐색','공고를 검색하고 검토합니다.')+`<div class="toolbar"><input id="search" aria-label="공고 검색" placeholder="공고명 또는 기관 검색" value="${esc(query)}"><select id="filter" aria-label="공고 상태"><option value="">전체 상태</option><option value="active" ${filter==='active'?'selected':''}>취소 제외</option><option value="cancel" ${filter==='cancel'?'selected':''}>취소 이력</option></select><select id="scenario" aria-label="시안 상태 선택"><option value="normal">정상 시안</option><option value="empty" ${scenario==='empty'?'selected':''}>빈 결과 시안</option><option value="error" ${scenario==='error'?'selected':''}>오류 시안</option><option value="slow">5초 로딩 시안</option><option value="timeout">시간 초과 시안</option></select></div><p id="loadStatus" class="muted" role="status" aria-live="polite"></p><section class="card" id="results">${results()}</section>`;}
function results(){if(scenario==='error')return '<div class="empty"><h2>공고를 불러오지 못했습니다</h2><p>다시 시도하거나 정상 시안으로 전환하세요.</p></div>';const items=scenario==='empty'?[]:samples.filter(n=>(n.title+n.org).includes(query)&&(filter==='cancel'?n.id===5:filter==='active'?n.id!==5:true));return `<div class="cardhead"><h2>공고 ${items.length}건</h2><small>합성 자료 / 서버 조회 없음</small></div>`+(items.length?table(items):'<div class="empty">조건에 맞는 공고가 없습니다. 검색어와 필터를 바꿔보세요.</div>');}
function detail(){const n=samples.find(x=>x.id===selected);return head(n.title,n.org+' / '+n.field,btn('공고 목록','notices')+' '+btn('원본 이력','versions'))+`<section class="card"><div class="facts"><div><small>공고 상태</small>${badge(n.risk,n.id===5?'red':'warn')}</div><div><small>마감</small><b>${n.deadline}</b></div><div><small>공고 예산</small><b>${n.budget}</b><small>예산은 예상 수익이 아닙니다</small></div></div></section><div class="tabs" aria-label="공고 상세 메뉴">${[['summary','요약'],['qualification','참가자격'],['evaluation','평가기준'],['scope','과업 범위'],['evidence','원문 확인'],['decision','판단 기록']].map(([v,t])=>`<button data-tab="${v}" class="${v===detailTab?'active':''}" aria-pressed="${v===detailTab}">${t}</button>`).join('')}</div><section class="card pad">${detailTab==='summary'?`<h2>지금 확인할 것</h2><p class="muted">${n.next}</p><div class="split"><div><h3>공식 원문 사실</h3><p>모든 내용은 합성입니다. ${n.id===5?'취소 이력을 보존합니다.':'최신 원본, 차수 확인 전입니다.'}</p><h3>검토 방향</h3><p>관심 분야가 맞아도 참가자격, 인력, 원가가 확인되기 전에는 판단을 보류합니다.</p></div><div class="rule"><b>판단 보류</b><p>회사 자격과 인력, 원가를 확인해 주세요.</p><p>기술 부족만으로 자동 불참 처리하지 않습니다.</p></div></div><div class="actions">${btn('문서 확인으로','documents',true)}${btn('회사 증빙 보기','company')}</div>`:detailTab==='evidence'?`<h2>원문과 추출 결과</h2><p>참가자격 / 평가기준 / 과업 요구사항을 구분합니다. 승인 전 추출 후보는 정답이 아닙니다.</p>${selected===1?btn('원본, 추출 비교 시안 열기','review',true):'<p class="rule">이 공고의 비교 시안은 준비 전입니다. 문서 확인 메뉴에서 1번 합성 사례를 볼 수 있습니다.</p>'}<details><summary>문서 버전, 출처 상세</summary><p>가상 문서 RFP-DEMO-01 / 실원본 URL/SHA 없음 / 최신성 미검증</p></details>`:['qualification','evaluation','scope'].includes(detailTab)?`<h2>${({qualification:'참가자격',evaluation:'평가기준',scope:'과업 범위'})[detailTab]}</h2><p>${({qualification:'필수 면허와 실적 조건: 공식 원문 확인 전 / 회사 충족 여부 미검증',evaluation:'평가 항목과 배점: 원문 근거 확인 전 / 임의 점수 없음',scope:'요구사항별 산출물과 수행 범위: 원문 대조 필요'})[detailTab]}</p>${btn('1번 합성 원문 사례 보기','review')} ${btn('요구사항 대응표','requirements')}`:decisionForm()}</section>`;}
function decisionForm(){const record=decisionRecords[selected]||{state:'확인 보류',reason:''};const item=samples.find(n=>n.id===selected);return `<h2>사람의 검토 기록</h2><p class="muted">${esc(item.title)}<br>현재 시안 상태: ${esc(record.state)} / 자격, 수익성 미검증 유지</p><label for="decision">검토 방향</label><select id="decision">${["확인 보류","참여 검토 계속","불참 검토"].map(v=>`<option ${v===record.state?"selected":""}>${v}</option>`).join("")}</select><label for="reason">이유 (가상 내용만 입력)</label><textarea id="reason" placeholder="예: 투입 인력 증빙을 확인한 뒤 재검토">${esc(record.reason)}</textarea><div class="actions"><button class="primary" data-action="decision">시안에 기록</button></div><p class="muted">실제 입찰 제출, 참가 확정이 아니며 새로고침하면 사라집니다.</p>`;}
function documents(){return head('문서 확인','부족한 문서를 확인하고 원문을 대조합니다.')+`<section class="card"><div class="cardhead"><h2>확인이 필요한 문서</h2>${badge('합성 2건')}</div>${[samples[0],samples[3]].map(n=>`<div class="task"><div class="tasknum">▧</div><div class="taskmain"><h3>${n.title}</h3>${badge(n.risk)}<p>${n.next}</p>${n.id===1?'<button data-page="review" class="primary">원본 대조</button>':'<button data-action="missing">확보 전 보류 이유 보기</button>'}</div></div>`).join('')}</section><div class="rule">조회만으로 다운로드하지 않습니다.</div>`;}
function review(){return head('원본과 추출 결과 대조','민원 상담 지식검색 서비스 구축 / 합성 문서 1쪽',btn('문서 목록','documents'))+`<div class="split"><section><div class="cardhead"><h2>원문 예시</h2>${badge('가상 문서')}</div><div class="paper"><h3>제안요청서 / 과업 범위</h3><p>1. 사업 목적<br>민원 상담을 위한 지식검색 서비스를 구축한다.</p><p><mark>제안사는 검색 결과에 원문 출처를 표시해야 한다.</mark></p><p>2. 검증 항목<br>검색 결과의 근거 확인 및 오류 정정 기능을 제공한다.</p>${structureFixture()}<div class="paperfooter">페이지 1 / 1 / 화면 비교용 합성 구절<br>실제 PDF 렌더러, 공식 원본, OCR 미연결</div></div></section><section class="card pad"><h2>검수할 구절</h2><p class="muted">추출 후보: 검색 결과에 원문 출처를 표시해야 한다.</p><label for="category">분류</label><select id="category">${["과업 요구사항","참가자격","평가기준"].map(v=>`<option ${v===reviewDraft.category?"selected":""}>${v}</option>`).join("")}</select><label for="gold">정답 구절 (합성 시연)</label><textarea id="gold">${esc(reviewDraft.gold)}</textarea><label for="location">원문 위치</label><input id="location" value="${esc(reviewDraft.location)}"><div class="checklist"><label><input id="checked" type="checkbox">표시된 합성 원문과 직접 대조했습니다</label></div><div class="actions"><button class="primary" data-action="approve">시안 승인</button><button data-action="hold">보류</button><button data-action="add">누락 구절 입력</button></div><p id="reviewStatus" role="status" style="margin-top:16px">검수 상태: ${esc(reviewState)}</p><div class="rule">실자료 정확도: 미평가<br>실제 평가에는 반영되지 않습니다.</div><details><summary>문서 식별, 버전</summary>가상 문서만 표시. 원본 SHA 결속 및 서버 저장은 후속 구현 대상.</details></section></div>`;}
function company(){return head('회사 증빙','자격, 기술, 인력, 원가를 서로 구분해서 확인합니다.',btn('증빙 등록','evidenceEdit')+' '+btn('인력과 원가','workforce'))+`<div class="split">${[['필수 참가자격','면허, 등록, 실적 증빙','미등록'],['기술, 협력 역량','부족한 기술의 보완 경로와 비용','보완 검토'],['인력, 투입 공수','역할별 가용 기간과 MM','미확인'],['원가, 수익성','외주, 인건비, 운영비 산정 근거','미검증']].map(([t,d,s])=>`<section class="card pad"><h2>${t}</h2><p class="muted">${d}</p>${badge(s)}<div class="actions"><button data-action="evidence">필요 자료 확인</button></div></section>`).join('')}</div><div class="rule">실제 회사 정보는 입력하지 마세요.</div>`;}
function settings(){return head('설정','두 사용자의 업무 기준과 운영 설정을 관리합니다.')+settingsNav()+`<div class="tablewrap"><table><thead><tr><th>설정</th><th>내용</th><th>열기</th></tr></thead><tbody>${[['criteria','검토 기준','필수조건 8개와 영향인자 12개'],['users','사용자 관리','최종 결정 사용자과 검토 사용자 계정'],['interests','업무 관심 분야','분야와 검색어, 재분류'],['audit','감사 및 변경 기록','변경 전후와 실행 이력'],['account','내 계정','비밀번호와 세션'],['connections','연결 설정','나라장터와 AI 도구']].map(([r,t,d])=>`<tr><td>${t}</td><td>${d}</td><td>${btn('열기',r)}</td></tr>`).join('')}</tbody></table></div>`;}
function proposal(){const n=samples.find(x=>x.id===selected),p=proposalState();return head('제안서',n.title,btn('사업 검토로','home'))+`<p class="muted">합성 편집 시안입니다. 전체 절을 한 버전으로 저장하며 새로고침하면 초기화됩니다.</p>${workflowState().state==='STOPPED'?'<p class="rule">STOP / 모델 장애로 자동 초안과 출력이 중지됐습니다. 기존 수동 입력은 보존됩니다.</p>':''}<div class="writingdesk"><aside class="outline"><b>전체 절</b>${p.draft.map(x=>`<p>${esc(x.title)}</p>`).join('')}<p id="proposalVersion">저장 버전 ${p.head}</p><p id="proposalDirty">${isProposalDirty()?'미저장 변경 있음':'저장본과 같음'}</p></aside><section class="drafteditor">${p.draft.map((x,i)=>`<label for="proposal-${i}-title">${i+1}. 절 제목</label><input class="full" id="proposal-${i}-title" data-proposal="${i}" data-property="title" value="${esc(x.title)}" maxlength="300"><label for="${i===0?'proposalDraft':'proposal-'+i+'-body'}">절 본문</label><textarea class="section-body" id="${i===0?'proposalDraft':'proposal-'+i+'-body'}" data-proposal="${i}" data-property="body">${esc(x.body)}</textarea>`).join('')}<details><summary>저장 오류 시안</summary><label for="proposalScenario">검증 상황</label><select id="proposalScenario">${[['normal','정상'],['invalid','마지막 절 오류 (422)'],['oversize','전체 byte 한도 초과 (413)'],['conflict','다른 사용자 저장 (409)']].map(([v,t])=>`<option value="${v}" ${p.scenario===v?'selected':''}>${t}</option>`).join('')}</select></details><div class="actions"><button class="primary" data-mock="proposal-save">전체 절 스냅샷 저장</button>${p.conflict?'<button data-mock="proposal-rebase">최신 버전 확인 / 입력 유지</button>':''}</div><p id="proposalStatus" role="status">${esc(p.message||'전체 절과 근거를 함께 저장합니다. 실제 DB 연결은 없습니다.')}</p><section class="connection-section"><h2>출력</h2><label for="exportFormat">공식 지원 대상 형식</label><select id="exportFormat">${['hwpx','docx'].map(v=>`<option value="${v}" ${p.format===v?'selected':''}>${v.toUpperCase()}</option>`).join('')}</select><p>출력 대상: 저장 버전 ${p.head} / 양식: 미연결</p><button data-mock="export-preview">출력 준비 확인</button><p id="exportStatus" role="status">${esc(p.exportMessage||'어댑터 미구현. 실제 파일을 생성하거나 다운로드하지 않습니다.')}</p></section><details><summary>근거와 누락</summary><p>공식 원문과 회사 증빙은 미확인입니다. 이 합성 초안은 입찰 적격 판정이 아닙니다.</p></details><div class="actions">${btn('원문 확인','documents')}${btn('결정 기록','decisions')}${btn('대응표','requirements')}${btn('제안 전략','strategy')}</div></section></div>`;}

function connections(){return head('연결 설정','나라장터와 AI 도구의 인증 상태를 확인합니다.')+`<section class="connection-section"><div class="section-line"><h2>나라장터 OpenAPI</h2>${badge('미확인')}</div><p class="muted">시안에서는 키를 입력하거나 저장하지 않습니다.</p><label for="g2b-key">API 키</label><input class="full" id="g2b-key" type="password" disabled placeholder="실제 설정 화면에서 입력"><div class="actions"><button data-action="key-demo">등록 동선 보기</button><button data-action="connection-demo">연결 점검 예시</button><button data-action="key-remove-demo">키 삭제 동선 보기</button></div></section><section class="connection-section"><h2>AI 도구</h2><p class="muted">설치, 인증, 모델 사용 가능 여부를 구분합니다. 실제 환경은 아직 점검하지 않았습니다.</p><div class="tablewrap"><table><thead><tr><th>도구</th><th>설치</th><th>인증</th><th>사용 가능</th><th>점검</th></tr></thead><tbody>${['Codex','Claude','agy'].map(tool=>`<tr><td><b>${tool}</b>${tool==='agy'?'<small>신규 연동 설계 필요</small>':''}</td><td data-label="설치">미확인</td><td data-label="인증">미확인</td><td data-label="모델">미확인</td><td><button data-action="provider-demo" data-provider="${tool}">점검 예시</button></td></tr>`).join('')}</tbody></table></div><div class="rule">PC의 로그인 상태가 서버로 자동 이전되지는 않습니다. 문서 전송 범위와 사용할 계정은 별도로 설정합니다.</div><p id="connectionStatus" role="status"></p></section>`;}
function login(){return `<div class="auth">${head(authStep==='change'?'비밀번호를 변경하세요':authStep==='again'?'변경 후 다시 로그인':'워크스페이스 로그인','로그인 시안입니다. 실제 암호는 입력하지 마세요.')}<section class="card pad">${authStep==='change'?'<h2>비밀번호 변경 필요</h2><p>업무 화면 접근 전에 본인 비밀번호로 변경합니다.</p><label>현재 임시 비밀번호<input disabled type="password" placeholder="입력 비활성 / 시안"></label><label>새 비밀번호<input disabled type="password" placeholder="입력 비활성 / 시안"></label><label>새 비밀번호 확인<input disabled type="password" placeholder="입력 비활성 / 시안"></label><button class="primary full" data-action="password">변경 완료 동선 시연</button>':'<label>계정<input disabled value="최종 결정 사용자 (가상 계정)"></label><label>비밀번호<input disabled type="password" placeholder="실제 암호 입력 금지"></label><button class="primary full" data-action="login">'+(authStep==='again'?'재로그인 동선 시연':'첫 로그인 동선 시연')+'</button>'}<p class="muted" style="margin-top:15px">실제 인증은 연결되지 않았습니다.</p></section></div>`;}
function render(focus=true){$('#crumb').textContent=names[page];$('#main').innerHTML=`<div class="screen"><div class="screenlinks">${btn('전체 화면','screens')}${['criteria','users','interests','audit'].includes(page)?settingsNav():''}</div>${({home,notices,detail,documents,review,company,operations,settings,login,proposal,connections,criteria,users,interests,audit,candidates,jobs,requirements,strategy,preparation,outcomes,account,states,screens,evidenceEdit,workforce,versions,decisions:()=>head('판단 기록','사람이 남긴 검토 방향과 근거를 확인합니다.')+'<section class="card pad">'+decisionForm()+'</section>'+finalDecisionForm()})[page]()}</div>`;document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(focus)$('#main').focus();}
function go(next){clearLoading();page=next;history.replaceState(null,'','#'+next);if(next==='login')authStep='login';$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.brief){selected=Number(b.dataset.brief);render(false);return;}if(b.dataset.notice){selected=Number(b.dataset.notice);detailTab='summary';go('detail');return;}if(b.dataset.tab){detailTab=b.dataset.tab;render(false);return;}switch(b.dataset.action){case 'key-demo':toast('등록 시 키를 비공개 저장하고 화면에 다시 표시하지 않습니다. 실제 저장 없음.');break;case 'key-remove-demo':toast('삭제 확인 후 예약 작업에 미치는 영향을 안내합니다. 실제 삭제 없음.');break;case 'connection-demo':toast('연결 점검 시안입니다. 실제 API 요청은 보내지 않았습니다.');break;case 'provider-demo':$('#connectionStatus').textContent=b.dataset.provider+' 점검 예시: 설치 경로 확인 → 인증 확인 → 모델 권한 확인. 실제 점검은 미실행입니다.';break;case 'stop-loading':clearLoading();scenario='normal';$('#scenario').value='normal';$('#results').innerHTML=results();$('#loadStatus').textContent='대기를 중단했습니다.';$('#scenario').focus();break;case 'retry-loading':startLoading(lastLoadingMode);break;case'approve':if(structureMode!=='PARSED'){toast('UNKNOWN / 각주 결속 확인 전에는 승인할 수 없습니다.');break;}if(!$('#checked').checked||!$('#gold').value.trim()||!$('#location').value.trim()){toast('원문 대조 체크, 구절과 위치를 확인해 주세요.');break;}approvedReview={...reviewDraft};reviewState='합성 시안 승인 / 실자료 미평가';$('#reviewStatus').textContent='검수 상태: '+reviewState;toast('시안에서 승인했습니다.');break;case'hold':approvedReview=null;reviewState='합성 시안 보류';$('#reviewStatus').textContent='검수 상태: '+reviewState;break;case'add':$('#gold').value='';updateReview('gold','');$('#checked').checked=false;$('#gold').focus();toast('누락된 합성 구절을 입력하고 위치를 지정하세요.');break;case'decision':if(!$('#reason').value.trim()){toast('판단 이유를 가상 내용으로 입력해 주세요.');$('#reason').focus();break;}decisionRecords[selected]={state:$('#decision').value,reason:$('#reason').value};render(false);toast('시안에 기록했습니다.');break;case'missing':toast('공식 첨부 미확보: 최신 원본 확보 전 분석, 재평가 보류');break;case'evidence':toast('필요 자료 예시: 유효한 증빙, 확인일, 담당자, 적용 범위');break;case'collect':toast('실행 전 범위, 중복 작업, 권한을 확인하는 위치입니다. 실제 수집은 실행하지 않습니다.');break;case'login':if(authStep==='again')go('home');else{authStep='change';render();}break;case'password':authStep='again';render();toast('새 비밀번호로 다시 로그인합니다.');break;}});
$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));};
function updateReview(key,value){reviewDraft[key]=value;approvedReview=null;reviewState='수정됨 / 재검수 필요';if($('#checked'))$('#checked').checked=false;if($('#reviewStatus'))$('#reviewStatus').textContent='검수 상태: '+reviewState;}
document.addEventListener('input',e=>{if(['gold','location'].includes(e.target.id))updateReview(e.target.id,e.target.value);if(e.target.id==='search'){query=e.target.value;if(!loadingActive)$('#results').innerHTML=results();}});
document.addEventListener('change',e=>{if(e.target.id==='category'){updateReview('category',e.target.value);return;}if(e.target.id==='filter')filter=e.target.value;else if(e.target.id==='scenario')scenario=e.target.value;else return;if(e.target.id==='scenario'&&['slow','timeout'].includes(scenario)){startLoading(scenario);return;}clearLoading();$('#results').innerHTML=results();});

// 로딩 시안: 즉시 스켈레톤, 3초 뒤 지연 안내. 실제 API 호출이나 작업 취소 없음.
let loadingActive=false,loadingEpoch=0,loadingTimers=[],lastLoadingMode='slow';
function clearLoading(){loadingEpoch++;loadingTimers.forEach(clearTimeout);loadingTimers=[];loadingActive=false;const region=$('#results');if(region)region.removeAttribute('aria-busy');if($('#loadStatus')){$('#loadStatus').textContent='';$('#loadStatus').classList.remove('sr-only');}if(['slow','timeout'].includes(scenario)){scenario='normal';if($('#scenario'))$('#scenario').value='normal';}}
function startLoading(mode){clearLoading();lastLoadingMode=mode;scenario=mode;loadingActive=true;const epoch=loadingEpoch;$('#scenario').value=mode;$('#results').setAttribute('aria-busy','true');$('#loadStatus').classList.add('sr-only');$('#loadStatus').textContent='공고를 불러오는 중입니다.';$('#results').innerHTML=`<div class="loadingbox"><div class="loadingtitle"><span class="spinner" aria-hidden="true"></span>공고를 불러오는 중</div><div aria-hidden="true">${'<div class="skeleton-row"><span></span><span></span></div>'.repeat(4)}</div><div id="slowHint" class="slowhint" hidden><p>예상보다 오래 걸리고 있습니다.</p><button data-action="stop-loading">대기 중단</button></div></div>`;
loadingTimers.push(setTimeout(()=>{if(epoch!==loadingEpoch)return;$('#slowHint').hidden=false;$('#loadStatus').textContent='예상보다 오래 걸리고 있습니다. 기다리거나 대기를 중단할 수 있습니다.';},3000));
loadingTimers.push(setTimeout(()=>{if(epoch!==loadingEpoch)return;clearLoading();if(mode==='timeout'){scenario='error';$('#scenario').value='error';$('#results').innerHTML='<div class="empty"><h2>응답 시간이 초과됐습니다</h2><p>다시 시도해 주세요.</p><button data-action="retry-loading">다시 시도</button></div>';$('#loadStatus').textContent='응답 시간이 초과됐습니다.';}else{scenario='normal';$('#scenario').value='normal';$('#results').innerHTML=results();$('#loadStatus').textContent='공고를 불러왔습니다.';}},mode==='timeout'?10000:5000));}


// 전체 화면 시안: 메모리 상태와 변경 이력만 관리하며 실제 데이터, 인증, 외부 I/O에 연결하지 않는다.

function workflowState(){return workflowStates[selected]??={state:'ACTIVE',error:'',unknown:false,confirmed:false,epoch:1,jobs:[{name:'공고 수집',state:'FAILED',reason:'합성 연결 오류',attempt:0},{name:'문서 추출',state:'REVIEW_REQUIRED',reason:'원본 확보 전',attempt:0},{name:'모델 제안 초안',state:'QUEUED',reason:'모델 실행 예시',attempt:0},{name:'종속 검증과 출력',state:'QUEUED',reason:'모델 결과 대기',attempt:0}]};}
function canStartJob(j,w){return w.state!=='STOPPED'&&j.attempt<3&&['QUEUED','FAILED'].includes(j.state)&&j!==w.jobs[3];}
function stopPanel(){const w=workflowState();return `<section class="stop-panel" aria-labelledby="workflowTitle"><h2 id="workflowTitle">자동 준비 실행 ${w.state==='STOPPED'?'STOP':'시안'}</h2><p>현재 공고의 합성 실행입니다. 실제 모델 호출은 없습니다.</p>${w.state==='STOPPED'?`<p class="statuscode"><b>STOPPED / ${esc(w.error)}</b><br>실패 작업: FAILED / 종속 작업: REVIEW_REQUIRED</p><p>${w.unknown?'원 요청 결과 불명 / 실제 종료 미확인':'합성 오류 확인 / 자동 재호출 없음'}</p><p>자동 초안과 출력은 중지됐으며 기존 입력과 성공본은 보존됩니다.</p><div class="checklist"><label><input id="resumeConfirmed" type="checkbox" ${w.confirmed?'checked':''} ${w.unknown?'disabled':''}>원 요청 종료와 권한, 비용 한도를 확인했습니다. (시연)</label></div>${w.unknown?'<button data-mock="resolve-result">원 요청 종료 확인 시연</button>':''}<button data-mock="workflow-resume" ${w.unknown||!w.confirmed||w.jobs[2].attempt>=3?'disabled':''}>명시 재개 시안</button>`:'<p>모델 장애 시 자동 fallback 없이 관련 흐름을 멈춥니다.</p>'}<div class="actions"><button data-mock="stop-error">모델 장애 시연</button><button data-mock="stop-timeout">타임아웃 / 결과 불명 시연</button></div></section>`;}
function stopWorkflow(unknown){const w=workflowState();w.state='STOPPED';w.error=unknown?'PROVIDER_RESULT_UNKNOWN':'PROVIDER_ERROR';w.unknown=unknown;w.confirmed=false;w.epoch++;w.jobs[2].state='FAILED';w.jobs[2].reason=w.error;w.jobs[3].state='REVIEW_REQUIRED';w.jobs[3].reason='선행 모델 STOP / 게시 금지';logDemo('작업','모델 STOP','ACTIVE',w.error);render(false);}
function mutateJob(i,action){const w=workflowState(),j=w.jobs[i];if(!j)return;if(w.state==='STOPPED')return;if(i===2&&action==='finish'&&j.state==='RUNNING'){stopWorkflow(false);return;}const before=j.state;if(action==='retry'&&canStartJob(j,w)){j.attempt++;j.state='RUNNING';j.reason='실제 프로세스 없는 시연';}else if(action==='cancel'&&j.state==='RUNNING')j.state='CANCEL_REQUESTED';else if(action==='finish'&&['RUNNING','CANCEL_REQUESTED'].includes(j.state))j.state=j.state==='CANCEL_REQUESTED'?'CANCELLED':'FAILED';if(before!==j.state)logDemo('작업',j.name,before,j.state);render(false);}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.proposal!==undefined){proposalState().draft[+t.dataset.proposal][t.dataset.property]=t.value;$('#proposalDirty').textContent='미저장 변경 있음';}if(t.dataset.final){const f=decisionState();f[t.dataset.final]=t.type==='checkbox'?t.checked:t.value;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='proposalScenario')proposalState().scenario=t.value;if(t.id==='exportFormat'){proposalState().format=t.value;proposalState().exportMessage='';$('#exportStatus').textContent='선택 형식 '+t.value.toUpperCase()+' / 실제 출력 어댑터 미연결';}if(t.dataset.final)decisionState()[t.dataset.final]=t.type==='checkbox'?t.checked:t.value;if(t.id==='structureMode'){structureMode=t.value;updateReview('location',reviewDraft.location);render(false);}if(t.id==='resumeConfirmed'){workflowState().confirmed=t.checked;render(false);}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.mock)return;const f=()=>decisionState();switch(b.dataset.mock){case'proposal-save':saveProposal();break;case'proposal-rebase':{const p=proposalState();p.base=p.head;p.conflict=false;p.scenario='normal';p.message='최신 버전을 확인했습니다. 보존된 전체 입력을 검토하고 다시 저장하세요.';render(false);break;}case'export-preview':{const p=proposalState();p.exportMessage=workflowState().state==='STOPPED'?'STOP / 실패 실행에서 출력하지 않습니다.':isProposalDirty()?'미저장 변경을 먼저 저장하세요. 실제 출력 없음.':'EXPORT_ADAPTER_UNAVAILABLE / '+p.format.toUpperCase()+' 지원 대상 / 저장 v'+p.head+' / 양식 미연결. 실제 파일 없음.';$('#exportStatus').textContent=p.exportMessage;break;}case'source-change':sourceVersions[selected]=(sourceVersions[selected]??1)+1;f().message='합성 원본이 변경됐습니다. 실제 자료는 그대로입니다.';render(false);break;case'decision-diff':if(f().conflict){f().diff=true;render(false);}break;case'decision-refresh':if(f().conflict&&f().diff){f().snapshot=sourceStamp();f().conflict=false;f().diff=false;f().checked=false;f().message='새 snapshot을 발급했습니다. 최신 자료를 다시 확인하고 체크한 뒤 기록하세요.';render(false);}break;case'stop-error':stopWorkflow(false);break;case'stop-timeout':stopWorkflow(true);break;case'resolve-result':workflowState().unknown=false;workflowState().confirmed=false;render(false);break;case'workflow-resume':{const w=workflowState();if(w.state==='STOPPED'&&!w.unknown&&w.confirmed&&w.jobs[2].attempt<3){w.state='ACTIVE';w.epoch++;w.jobs[2].state='QUEUED';w.jobs[2].reason='명시 재개 후 시작 대기';w.jobs[3].state='QUEUED';w.jobs[3].reason='모델 결과 대기';w.confirmed=false;render(false);}break;}}});

window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(Object.hasOwn(names,route)&&route!==page)go(route);});
if(Object.hasOwn(names,location.hash.slice(1)))page=location.hash.slice(1);
render(false);
</script></body></html>
